<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Creating token embeddings</title>
  <desc id="desc">Text is tokenized into token IDs, which select rows from a trainable embedding table to produce dense vectors.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#f8fafc"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Creating token embeddings</text>

  <rect x="48" y="150" width="215" height="135" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="155" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#5b21b6">Input text</text>
  <text x="155" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b21b6">Hello world!</text>

  <path d="M283 218 H350" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="317" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">tokenize</text>

  <rect x="370" y="150" width="220" height="135" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="480" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Token IDs</text>
  <text x="480" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e3a8a">[15496, 995, 0]</text>

  <path d="M610 218 H677" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="644" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">look up</text>

  <rect x="697" y="100" width="210" height="260" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="802" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">Embedding table</text>
  <text x="802" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">trainable lookup table</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#78350f">
    <rect x="723" y="193" width="158" height="33" rx="5" fill="#fde68a"/><text x="802" y="215" text-anchor="middle">15496  [0.12, -0.44, ...]</text>
    <rect x="723" y="234" width="158" height="33" rx="5" fill="#fed7aa"/><text x="802" y="256" text-anchor="middle">995    [-0.31, 0.68, ...]</text>
    <rect x="723" y="275" width="158" height="33" rx="5" fill="#fde68a"/><text x="802" y="297" text-anchor="middle">0      [0.07, 0.19, ...]</text>
  </g>

  <path d="M927 218 H984" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="1004" y="120" width="160" height="195" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1084" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Embeddings</text>
  <text x="1084" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">3 vectors × d dimensions</text>
  <g fill="#bbf7d0" stroke="#16a34a" stroke-width="1"><rect x="1035" y="207" width="98" height="20" rx="3"/><rect x="1035" y="237" width="98" height="20" rx="3"/><rect x="1035" y="267" width="98" height="20" rx="3"/></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#166534"><text x="1084" y="222" text-anchor="middle">[0.12, -0.44, ...]</text><text x="1084" y="252" text-anchor="middle">[-0.31, 0.68, ...]</text><text x="1084" y="282" text-anchor="middle">[0.07, 0.19, ...]</text></g>

  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Each token ID retrieves one learned dense vector from the embedding table.</text>
  <text x="600" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Positional embeddings are added later to encode where each token appears in the sequence.</text>
</svg>
